<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patch Hub — Downloads Oficiais</title>
  <meta name="description" content="Central de downloads de Patches: capas, descrições, códigos e links para todas as versões.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#" class="brand"><span class="brand-mark">▲</span> PATCH<span>HUB</span></a>
      <div class="top-actions">
        <input id="search" type="search" placeholder="Buscar por título ou código...">
        <button id="btnAdmin" class="btn btn-ghost">Admin</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <p class="eyebrow">// central de downloads</p>
      <h1>Patches disponíveis</h1>
      <p class="muted">Escolha um Patch e baixe a versão desejada.</p>
    </div>
  </section>

  <!-- Painel admin -->
  <section id="adminPanel" class="container admin-panel hidden">
    <div class="panel-head">
      <h2 id="formTitle">Novo Patch</h2>
      <button id="btnLogout" class="btn btn-ghost">Sair</button>
    </div>
    <form id="patchForm">
      <input type="hidden" id="patchId">
      <div class="grid-2">
        <label>Título<input id="fTitle" required></label>
        <label>Código único<input id="fCode" required placeholder="EX: PTH-2026-001"></label>
        <label>URL da capa (DVD)<input id="fCover" type="url" required placeholder="https://..."></label>
        <div class="size-row">
          <label>Tamanho<input id="fSize" type="number" step="0.01" min="0" required></label>
          <label>Unidade<select id="fUnit"><option>GB</option><option>MB</option></select></label>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="fVisible" checked> Exibir este Patch na tela principal <small>(desmarcado = fica salvo apenas para gerar ZIP)</small></label>
      <label>Descrição<textarea id="fDesc" rows="4" required></textarea></label>
      <div class="links-head">
        <h3>Links de download</h3>
        <button type="button" id="btnAddLink" class="btn btn-ghost">+ Adicionar link</button>
      </div>
      <div id="linksList"></div>
      <div class="form-actions">
        <button type="button" id="btnCancel" class="btn btn-ghost">Cancelar edição</button>
        <button type="submit" class="btn btn-ghost">Salvar Patch</button>
        <button type="submit" id="btnSaveGen" class="btn btn-primary">Salvar e gerar página (ZIP)</button>
      </div>
    </form>
  </section>

  <main class="container">
    <div id="status" class="status">Carregando patches...</div>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="footer">
    <div class="container">© <span id="year"></span> PatchHub — Todos os direitos reservados.</div>
  </footer>

  <!-- Modal login -->
  <div id="loginModal" class="modal hidden">
    <form id="loginForm" class="modal-box">
      <div id="loginLoading" class="loading hidden"><div class="spinner"></div><p>Entrando...</p></div>
      <h2>Acesso Admin</h2>
      <label>E-mail<input id="lEmail" type="email" autocomplete="off" placeholder="seu e-mail" required></label>
      <label>Senha<input id="lPass" type="password" required></label>
      <p id="loginError" class="error"></p>
      <div class="form-actions">
        <button type="button" id="btnCloseLogin" class="btn btn-ghost">Fechar</button>
        <button type="submit" id="btnLogin" class="btn btn-primary">Entrar</button>
      </div>
    </form>
  </div>

  <!-- Modal detalhes -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-box detail-box">
      <button id="btnCloseDetail" class="close">×</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
